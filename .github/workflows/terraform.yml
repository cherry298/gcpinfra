name: Terraform GCP OIDC Project Test

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan only, or create/update the project"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-gcp-project-oidc-test
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  GCP_BOOTSTRAP_PROJECT_ID: ${{ vars.GCP_BOOTSTRAP_PROJECT_ID }}

jobs:
  terraform:
    # Run only from the repository's default branch, matching your WIF trust.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          for name in TF_STATE_BUCKET TF_STATE_PREFIX GCP_WORKLOAD_IDENTITY_PROVIDER GCP_TERRAFORM_SERVICE_ACCOUNT GCP_BOOTSTRAP_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: $name"
              exit 1
            fi
          done
          if grep -q '"REPLACE_WITH_' terraform.tfvars; then
            echo "::error::Replace the placeholder values in Infrastructure/terraform.tfvars."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive ..

      - name: Authenticate using existing OIDC service account
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_BOOTSTRAP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify OIDC credential exchange
        run: |
          # Force a real token exchange; never print the token.
          gcloud auth application-default print-access-token > /dev/null
          echo "OIDC credential exchange succeeded. Terraform will now test resource permissions."

      - name: Terraform init
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=$TF_STATE_PREFIX"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Refresh credentials before apply
        if: inputs.operation == 'apply'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_BOOTSTRAP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Terraform apply saved plan
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Verify created project
        if: inputs.operation == 'apply'
        run: |
          PROJECT_ID="$(terraform output -raw project_id)"
          gcloud projects describe "$PROJECT_ID" --format='yaml(projectId,projectNumber,lifecycleState,parent)'
          terraform output -no-color
